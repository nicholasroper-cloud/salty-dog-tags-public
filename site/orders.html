<!DOCTYPE html>

<style>
  .top{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;justify-content:space-between;margin:0 0 1.2rem}
  .key{display:flex;gap:.5rem;align-items:center}
  .key input{padding:.6rem .8rem;border:1.5px solid var(--rule);border-radius:10px;background:var(--salt);min-width:16rem}
  .tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1rem}
  .order{background:var(--salt);border:1px solid var(--rule);border-radius:var(--r);padding:1rem 1.1rem;margin:0 0 .8rem}
  .order__h{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between}
  .order__h code{font-family:Bungee,monospace;font-size:1.2rem;color:var(--navy)}
  .st{font-family:"DM Mono",monospace;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;border-radius:999px;padding:.3rem .7rem;background:var(--sand-2)}
  .st-new{background:var(--coral);color:#fff}.st-invoiced{background:var(--brass);color:#fff}.st-paid{background:var(--sea);color:#fff}.st-shipped,.st-done{background:var(--navy);color:var(--void)}
  .lines{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.6rem;margin:.8rem 0}
  .line{display:flex;gap:.7rem;align-items:center;background:var(--paper);border-radius:12px;padding:.5rem .6rem;font-size:.9rem}
  .line svg{width:4.2rem;flex:none}
  .ph-thumb{width:4.2rem;height:3.15rem;flex:none;border-radius:8px;object-fit:cover;background:var(--sand-2)}
  .ph-wrap{display:flex;flex-direction:column;gap:.3rem;align-items:flex-start}
  .ph-dl{font-family:"DM Mono",monospace;font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
  .meta{font-size:.9rem;color:var(--mute)}
  .mach{display:inline-block;font-family:"DM Mono",monospace;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;padding:.15rem .5rem;border-radius:999px;border:1px solid var(--line-2);margin-right:.4rem}
  .mach--uv{color:var(--cyan);border-color:var(--cyan)}
  .mach--fiber{color:var(--yellow);border-color:var(--yellow)}
  .mach--qr{color:var(--magenta,#ff3cac);border-color:var(--magenta,#ff3cac)}
  .warnflag{color:var(--yellow);font-weight:700}
  .acts{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem;align-items:center}
  .acts .btn{padding:.5rem .9rem;font-size:.66rem}
  .acts select{padding:.45rem .7rem;border:1.5px solid var(--rule);border-radius:999px;background:var(--salt)}
  .empty{color:var(--mute)}
  /* ---- Ship it panel (tag photo + tracking + customer email) ---- */
  .ship{margin:.9rem 0 0;padding:.9rem 0 0;border-top:1px dashed var(--line-2);display:grid;gap:.7rem}
  .ship__h{margin:0;display:flex;flex-wrap:wrap;gap:.4rem .8rem;align-items:baseline;font-family:"DM Mono",monospace;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
  .ship__h b{color:var(--cyan);font-weight:500}
  .ship__row{display:flex;gap:.8rem;align-items:center}
  .ship__ph{width:6.5rem;height:6.5rem;flex:none;border-radius:12px;object-fit:cover;background:var(--paper);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;text-align:center;font-size:.72rem;color:var(--dim);padding:.4rem;box-sizing:border-box}
  .ship__ph--warn{border:1.5px dashed var(--yellow);color:var(--yellow)}
  .ship__ctl{display:grid;gap:.4rem;min-width:0}
  .ship .btn{min-height:46px;padding:0 1.1rem;font-size:.7rem}
  .ship__file{position:relative;overflow:hidden;cursor:pointer}
  .ship__file input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
  .ship__fld{display:grid;gap:.3rem;font-size:.82rem;color:var(--mute)}
  .ship__fld input{font-size:16px;font-family:"DM Mono",monospace;letter-spacing:.04em;padding:.75rem .85rem;border:1.5px solid var(--line-2);border-radius:10px;background:var(--field);color:var(--text);width:100%;box-sizing:border-box}
  .ship__fld input[aria-invalid="true"]{border-color:var(--magenta)}
  .ship__err{color:var(--magenta-2);font-size:.82rem;min-height:0}
  .ship__tog{display:flex;gap:.6rem;align-items:center;font-size:.9rem;min-height:44px}
  .ship__tog input{width:1.35rem;height:1.35rem;accent-color:var(--magenta);flex:none}
  .ship__tog--off{color:var(--dim)}
  .ship__btns{display:flex;flex-wrap:wrap;gap:.5rem}
  .ship__btns .btn--solid{flex:1 1 12rem}
  .ship__info{margin:0;font-size:.88rem;line-height:1.5;color:var(--mute)}
  .ship__info a{color:var(--cyan)}
  .ship__ok{color:var(--lime)}.ship__bad{color:var(--magenta-2)}
  .ship__setup{margin:0;font-size:.82rem;color:var(--yellow)}
  .nav__tag{margin-left:.75rem;font-family:"DM Mono",monospace;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
</style>
</head>
<body>
<nav class="nav"><a class="nav__mark" href="/"><img src="/assets/logo/logo-final-horizontal-dark.svg?v=50" alt="Salty Dog Tags" width="172" height="44"><span class="nav__tag">Orders</span></a>
<div class="nav__links"><a href="/">Site</a><a href="https://www.clover.com/dashboard" target="_blank" rel="noopener">Clover</a></div></nav>
<main class="sec"><div class="wrap">
  <div class="top">
    <div><p class="eyebrow">Owner only</p><h2 style="margin:0">Orders</h2></div>
    <form class="key" id="keyForm"><input type="password" id="key" placeholder="Admin key" autocomplete="current-password"><button class="btn btn--solid" type="submit" style="padding:.6rem 1rem;font-size:.68rem">Load</button></form>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="list"><p class="empty">Paste the admin key once. It stays in this browser.</p></div>
  <section id="fbSec" style="margin-top:3rem" hidden><h2 style="margin:0 0 .8rem">Roast feedback</h2><div id="fbBox"></div></section>
  <section id="wallSec" style="margin-top:3rem" hidden><h2 style="margin:0 0 .8rem">Wall of Shame</h2>
    <form id="wallForm" class="field" style="display:grid;gap:.6rem;max-width:34rem">
      <input id="wName" placeholder="Dog name" required maxlength="40"><input id="wBreed" placeholder="Breed" maxlength="40">
      <input id="wL1" placeholder="Tag line 1" maxlength="30"><input id="wL2" placeholder="Tag line 2" maxlength="30">
      <textarea id="wRoast" placeholder="Roast line" required maxlength="280" rows="2"></textarea><input id="wCity" placeholder="City" maxlength="60">
      <input id="wImg" type="file" accept="image/*" required>
      <label><input id="wConsent" type="checkbox"> Owner consented to post (emailed photo)</label>
      <button class="btn btn--solid" type="submit" style="padding:.6rem 1rem;font-size:.68rem">Add to Wall</button>
    </form>
    <div id="wallList" style="margin-top:1rem"></div></section>
</div></main>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
  const $=(s)=>document.querySelector(s); const $$=(s)=>Array.from(document.querySelectorAll(s)); const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=(n)=>'$'+(Math.round(n*100)/100).toFixed(2);
  const STATUSES=['new','invoiced','paid','made','shipped','done','cancelled'];
  const SIZE={small:'Small 1"',medium:'Medium 1.5"',large:'Large 2"',xl:'XL 2.5"'};
  let key=''; try{key=localStorage.getItem('sdt-admin')||'';}catch{}
  let orders=[], tab='open';
  $('#key').value=key;
  function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('is-on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('is-on'),2000);}
  async function api(method,body){const r=await fetch('/api/orders',{method,headers:{'authorization':'Bearer '+key,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});if(r.status===401)throw new Error('Wrong key.');return r.json();}
  function tagSVGOld(t){const C={black:['#1E2124','#EDEFF2'],red:['#E23B3B','#EDEFF2'],royal:['#2F5FD8','#EDEFF2'],sky:['#5CB9EA','#26292E'],green:['#4FC27C','#EDEFF2'],yellow:['#F4C83F','#26292E'],silver:['#DADDE1','#26292E'],pink:['#F4BBD2','#26292E'],hotpink:['#EE5FA6','#EDEFF2'],stainless:['#C9CED4','#26292E'],brass:['#D2AB5C','#4A3610']};const c=C[t.finish]||C.black;
    const lines=t.front.length?t.front:t.back; const n=lines.length||1; const fs=Math.max(10,Math.min(18,120/Math.max(...lines.map(l=>l.length),1)*1.4));
    return `<svg viewBox="0 0 100 60"><rect x="4" y="4" width="92" height="52" rx="14" fill="${c[0]}"/><g font-family="Archivo,sans-serif" font-weight="700" fill="${c[1]}" text-anchor="middle" font-size="${fs}">${lines.map((l,i)=>`<text x="50" y="${30-((n-1)*fs*1.15)/2+i*fs*1.15+fs*.35}">${esc(l.toUpperCase())}</text>`).join('')}</g></svg>`;}
  /* ---- Zartan's template art, same source as app.js (see app.js for the full write-up). Paw is
     opt-in (shapes.json shapes.paw.ready === true exactly); bone/heart/round/military are opt-out
     (ready !== false). Until a shape's template loads and passes its sanity check, tagSVGOld runs. ---- */
  const FIN={black:{c:'#1E2124',ink:'light',kind:'anodized'},red:{c:'#E23B3B',ink:'light',kind:'anodized'},royal:{c:'#2F5FD8',ink:'light',kind:'anodized'},sky:{c:'#5CB9EA',ink:'dark',kind:'anodized'},green:{c:'#4FC27C',ink:'light',kind:'anodized'},yellow:{c:'#F4C83F',ink:'dark',kind:'anodized'},silver:{c:'#DADDE1',ink:'dark',kind:'anodized'},pink:{c:'#F4BBD2',ink:'dark',kind:'anodized'},hotpink:{c:'#EE5FA6',ink:'light',kind:'anodized'},stainless:{c:'#C9CED4',ink:'dark',kind:'stainless'},ssblack:{c:'#2B2E33',ink:'light',kind:'stainless'},navy:{c:'#1F3A6E',ink:'light',kind:'stainless'},gold:{c:'#D4AF4A',ink:'dark',kind:'stainless'},bronze:{c:'#B5885A',ink:'dark',kind:'stainless'},rainbow:{c:'#9C6BD6',ink:'dark',kind:'stainless'},polished:{c:'#E4E7EA',ink:'dark',kind:'stainless'},brass:{c:'#D2AB5C',ink:'dark',kind:'brass'}};
  const TEMPLATE_SHAPES=['bone','heart','round','military','paw'];
  const TEMPLATE_LAYER_IDS=['shadow','ring-back','edge','body','hole','bevel','ring-front'];
  const TEMPLATES={};
  const TPL_DEFS='<linearGradient id="sdt-en" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBFCFE"/><stop offset=".55" stop-color="#C9CED6"/><stop offset="1" stop-color="#EDF0F4"/></linearGradient>';
  function finishBaseColor(finish,f){return finish==='polished'?'#D9DDE2':finish==='gold'?'#D4AF4A':finish==='bronze'?'#9A6B3C':f.kind==='stainless'?'#BFC5CC':f.kind==='brass'?'#C9A24E':finish==='black'?'#1B1D21':finish==='ssblack'?'#17181C':(f.c||'#333');}
  function luminanceOf(hex){const h=hex.replace('#','');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return(0.299*r+0.587*g+0.114*b)/255;}
  function tplPrefixIds(svgText,shape){let out=svgText;for(const id of TEMPLATE_LAYER_IDS)out=out.split(`id="${id}"`).join(`id="${shape}-${id}"`);return out;}
  function tplParse(svgText,shape){if(!svgText)return null;const vb=/viewBox="([^"]+)"/.exec(svgText);if(!vb||vb[1].trim()!=='0 0 320 240')return null;if(svgText.indexOf('id="body"')===-1||svgText.indexOf(`id="${shape}-clip"`)===-1)return null;const close=svgText.lastIndexOf('</svg>');if(close===-1)return null;return tplPrefixIds(svgText.slice(svgText.indexOf('>')+1,close),shape);}
  function loadTemplates(){
    Promise.all([
      fetch('/assets/shapes/shapes.json?v=51').then(r=>r.json()),
      ...TEMPLATE_SHAPES.map(s=>fetch(`/assets/shapes/${s}.svg?v=51`).then(r=>r.ok?r.text():null).catch(()=>null)),
    ]).then(([geoDoc,...svgTexts])=>{
      TEMPLATE_SHAPES.forEach((shape,i)=>{
        const geo=(geoDoc.shapes||{})[shape]; const inner=tplParse(svgTexts[i],shape);
        if(!geo||!inner)return;
        const ready=shape==='paw'?geo.ready===true:geo.ready!==false;
        TEMPLATES[shape]={inner,area:geo.area,ready};
      });
      if(orders.length)render();
    }).catch(()=>{});
  }
  function tagSVGTemplate(t,tpl){
    const fin=FIN[t.finish]||FIN.black; const base=finishBaseColor(t.finish,fin);
    const lines=(t.front&&t.front.some(Boolean)?t.front:t.back).filter(Boolean).slice(0,4);
    const area=tpl.area; const n=Math.max(1,lines.length); const maxLen=Math.max(1,...lines.map(l=>l.length));
    let fs=Math.min(26,area.w/(maxLen*0.62),area.h/(n*1.2)); fs=Math.max(9,Math.floor(fs));
    const lh=fs*1.18, top=area.cy-((n-1)*lh)/2+fs*0.36;
    const textSvg=lines.map((l,i)=>`<text x="${area.cx}" y="${(top+i*lh).toFixed(1)}" text-anchor="middle" font-size="${fs}">${esc(l.toUpperCase())}</text>`).join('');
    const lightInk=luminanceOf(base)<0.5;
    const textMarkup=lightInk
      ?`<g fill="rgba(0,0,0,.55)" transform="translate(0,-1)">${textSvg}</g><g fill="rgba(255,255,255,.35)" transform="translate(0,1)">${textSvg}</g><g fill="url(#sdt-en)">${textSvg}</g>`
      :`<g fill="rgba(255,255,255,.5)" transform="translate(0,0.9)">${textSvg}</g><g fill="#1F2327">${textSvg}</g>`;
    return `<svg viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="color:${base}"><defs>${TPL_DEFS}</defs>${tpl.inner}<g font-family="Archivo,sans-serif" font-weight="700">${textMarkup}</g></svg>`;
  }
  function tagSVG(t){const tpl=TEMPLATES[t.shape];if(tpl&&tpl.ready)return tagSVGTemplate(t,tpl);return tagSVGOld(t);}
  loadTemplates();
  function cloverText(o){const items=[...(o.ornaments||[]).map(x=>`${x.qty}x holiday ornament, ${x.tier==='stainless'?'engraved stainless bone':'printed acrylic'} — ${x.name} ${x.year}${x.raised&&x.tier==='acrylic'?' (raised)':''} — art: ${x.art}${x.style?' ('+x.style+')':''}`),...o.tags.map(t=>`${t.qty}x ${t.shape} tag, ${SIZE[t.size]||t.size}, ${t.finish==='fullcolor'?'FULL COLOR print'+(t.raised?' + raised lettering':'')+' ['+t.art+(t.style?' / '+t.style:'')+']':t.finish} — front: ${t.front.join(' / ')} — back: ${t.back.join(' / ')}`),...o.prints.map(p=>`${p.qty}x ${p.item}${p.note?' ('+p.note+')':''}${p.price?' @ $'+p.price:' (quote)'}`)];
    return `Salty Dog Tags order ${o.id}\nCustomer: ${o.customer.name} <${o.customer.email}>${o.customer.phone?' '+o.customer.phone:''}\n${items.join('\n')}\n${o.customer.delivery==='pickup'?'Pickup at trailer':'Ship to: '+o.customer.address}\nSubtotal ${money(o.totals.subtotal)}${o.totals.discount?' | multi-tag discount -'+money(o.totals.discount):''} | shipping ${money(o.totals.shipping)} | TOTAL ${money(o.totals.total)} + tax${o.customer.note?'\nNote: '+o.customer.note:''}`;}
  /* ---- Ship it: tag photo, tracking, "Your tag shipped" email (functions/api/ship.js) ---- */
  let shipCfg={email:{configured:false}};
  const trackDraft={}, shipBusy={};
  async function loadShipCfg(){try{const r=await fetch('/api/ship',{headers:{authorization:'Bearer '+key}});if(r.ok)shipCfg=await r.json();}catch{}}
  async function shipApi(body){const r=await fetch('/api/ship',{method:'POST',headers:{authorization:'Bearer '+key,'content-type':'application/json'},body:JSON.stringify(body)});let d={};try{d=await r.json();}catch{}if(r.status===401)throw new Error('Wrong key.');if(!r.ok){const e=new Error(d.error||('Failed ('+r.status+')'));e.field=d.field;e.data=d;throw e;}return d;}
  // Same loose rules as functions/api/_email.js cleanTracking(). Keep them in step.
  function cleanTracking(raw){const s=String(raw||'').toUpperCase().replace(/[\s-]+/g,'');if(!s)return{ok:true,number:''};let m;if((m=/^420\d{5}(\d{20,22})$/.exec(s))||(m=/^420\d{9}(\d{20,22})$/.exec(s)))return{ok:true,number:m[1]};if(/^\d{20,22}$/.test(s)||/^[A-Z]{2}\d{9}US$/.test(s)||/^\d{10}$/.test(s))return{ok:true,number:s};return{ok:false,error:"Doesn't look like USPS tracking (20 to 22 digits starting 9, or like EC123456789US)."};}
  const uspsUrl=(n)=>'https://tools.usps.com/go/TrackConfirmAction?tLabels='+encodeURIComponent(n);
  const when=(t)=>new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  const shipPhotoUrl=(o)=>o.shipPhoto&&o.shipPhoto.token?`/api/tag-photo/${encodeURIComponent(o.id)}/${o.shipPhoto.token}`:'';
  function emailLine(o){const e=o.shipEmail;if(!e)return'';
    if(e.ok)return`<span class="ship__ok">Emailed</span> ${esc(e.to||o.customer.email)} &middot; ${esc(when(e.at))}${e.sends>1?' &middot; sent '+e.sends+'&times;':''}`;
    return`<span class="ship__bad">Email not sent:</span> ${esc(e.error||'unknown')}${e.at?' &middot; '+esc(when(e.at)):''}`;}
  function shipPanel(o){
    if(o.status==='cancelled')return'';
    const pickup=o.customer.delivery==='pickup', shipped=Boolean(o.shipped&&o.shipped.at), ph=shipPhotoUrl(o), emailOn=Boolean(shipCfg.email&&shipCfg.email.configured), busy=shipBusy[o.id]||'';
    const tr=o.shipped&&o.shipped.tracking||'';
    const draft=trackDraft[o.id]!=null?trackDraft[o.id]:tr;
    const head=shipped?`${pickup?'Ready':'Shipped'} <b>${esc(when(o.shipped.at))}</b>`:(pickup?'Ready for pickup':'Ship it');
    const photoBox=busy==='photo'?`<div class="ship__ph">Uploading&hellip;</div>`:ph?`<a href="${esc(ph)}" target="_blank" rel="noopener"><img class="ship__ph" src="${esc(ph)}" alt="Photo of the finished tag for ${esc(o.id)}"></a>`:`<div class="ship__ph ship__ph--warn">No tag photo yet</div>`;
    const trackInfo=shipped&&!pickup?(tr?`USPS <a href="${esc(uspsUrl(tr))}" target="_blank" rel="noopener">${esc(tr)}</a>`:'No tracking number'):'';
    const el=emailLine(o);
    return`<section class="ship" data-ship>
      <p class="ship__h">${head}</p>
      <div class="ship__row">${photoBox}<div class="ship__ctl">
        <label class="btn btn--ghost ship__file">${ph?'Retake photo':'Add tag photo'}<input type="file" accept="image/*" data-shipfile aria-label="${ph?'Retake':'Add'} tag photo for ${esc(o.id)}"></label>
        <span class="meta" style="font-size:.78rem">${ph?'This photo goes in the email.':'Snap the finished tag. It goes in the email.'}</span></div></div>
      ${(trackInfo||el)?`<p class="ship__info">${trackInfo}${trackInfo&&el?'<br>':''}${el}</p>`:''}
      ${pickup?'':`<label class="ship__fld">USPS tracking ${shipped?'':'(optional)'}<input data-track value="${esc(draft)}" inputmode="text" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="9400 1000 0000 0000 0000 00" enterkeyhint="done"></label><span class="ship__err" data-trackerr></span>`}
      ${shipped?'':(emailOn
        ?`<label class="ship__tog"><input type="checkbox" data-sendmail checked> Send &ldquo;${pickup?'ready':'shipped'}&rdquo; email to ${esc(o.customer.email)}</label>`
        :`<label class="ship__tog ship__tog--off"><input type="checkbox" disabled> Send email to customer</label><p class="ship__setup">Email not set up yet (see README)</p>`)}
      <div class="ship__btns">
        ${shipped
          ?`${pickup?'':`<button class="btn btn--ghost" data-ship-go ${busy?'disabled':''}>${busy==='ship'?'Saving&hellip;':'Save tracking'}</button>`}${emailOn?`<button class="btn btn--ghost" data-ship-resend ${busy?'disabled':''}>${busy==='resend'?'Sending&hellip;':(o.shipEmail&&o.shipEmail.ok?'Resend email':'Send email')}</button>`:''}`
          :`<button class="btn btn--solid" data-ship-go ${busy?'disabled':''}>${busy==='ship'?'Saving&hellip;':(pickup?'Mark ready for pickup':'Mark shipped')}</button>`}
      </div>
      ${shipped&&!emailOn?'<p class="ship__setup">Email not set up yet (see README)</p>':''}
    </section>`;}
  /* Phone photo -> JPEG, long side <= 1600px, aiming ~300 KB (server caps 700 KB in KV). Browsers apply
     EXIF rotation when drawing, so portrait shots stay portrait. */
  async function shrinkPhoto(file,maxSide=1600,target=300*1024){

    try{src=await createImageBitmap(file,{imageOrientation:'from-image'});w=src.width;h=src.height;}
    catch{src=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error("Couldn't read that photo."));im.src=URL.createObjectURL(file);});w=src.naturalWidth;h=src.naturalHeight;}

    const size=(u)=>Math.floor((u.length-u.indexOf(',')-1)*3/4);
    let best=null;
    for(const side of [maxSide,1280,1024]){for(const q of [.82,.74,.66,.58,.5]){const u=enc(side,q);best=u;if(size(u)<=target)return u;}}
    if(size(best)>650*1024)throw new Error('Photo is still too big after shrinking.');

    delete shipBusy[o.id];render();},true);
  $('#list').addEventListener('click',async e=>{
    const go=e.target.closest('[data-ship-go]'), re=e.target.closest('[data-ship-resend]');if(!go&&!re)return;
    const o=findOrder(e.target);if(!o||shipBusy[o.id])return;const box=e.target.closest('[data-ship]');
    if(re){if(!confirm(`Email ${o.customer.email} the "${o.customer.delivery==='pickup'?'ready':'shipped'}" message${o.shipEmail&&o.shipEmail.ok?' again':''}?`))return;
      shipBusy[o.id]='resend';render();
      try{const d=await shipApi({id:o.id,action:'resend'});Object.assign(o,d.order);toast(d.email&&d.email.ok?'Email sent.':'Email not sent: '+((d.email&&d.email.error)||'?'));}catch(err){toast(err.message);}
      delete shipBusy[o.id];render();return;}
    const inp=box.querySelector('[data-track]');let tracking='';
    if(inp){const t=cleanTracking(inp.value);if(!t.ok){inp.setAttribute('aria-invalid','true');box.querySelector('[data-trackerr]').textContent=t.error;inp.focus();return;}tracking=t.number;}
    const already=Boolean(o.shipped&&o.shipped.at);
    const mail=!already&&Boolean(box.querySelector('[data-sendmail]:checked'));
    if(mail&&!o.shipPhoto&&!confirm('No tag photo yet. The Bulldog Promise says they get one. Send the email without it?'))return;
    shipBusy[o.id]='ship';render();
    try{let d;
      try{d=await shipApi({id:o.id,action:'ship',tracking,email:mail});}
      catch(e1){ if(SDTSmart.askOverride(e1)) d=await shipApi({id:o.id,action:'ship',tracking,email:mail,smartOverride:true}); else throw e1; }
      Object.assign(o,d.order);delete trackDraft[o.id];SDTSmart.refresh();
      const em=d.email||{};toast(already?'Tracking saved.':(o.id+' → '+o.status+(mail?(em.ok?' · email sent':' · email NOT sent: '+(em.error||'?')):'')));}
    catch(err){toast(err.message);}
    delete shipBusy[o.id];render();});
  SDTSmart.init({key:()=>key,orders:()=>orders,toast,esc,rerender:()=>render()});
  if(key)load();

  /* ---- Wall of Shame ---- */
  async function wallLoad(){
    $('#wallSec').hidden=false;
    try{const d=await (await fetch('/api/wall',{cache:'no-store'})).json();
      $('#wallList').innerHTML=(d.entries||[]).map(e=>`<div style="display:flex;gap:.6rem;align-items:center;margin:.4rem 0"><img src="${esc(e.image)}" width="48" height="48" style="object-fit:cover;border-radius:8px"><span style="flex:1">${esc(e.name)} (${esc(e.breed)}) - ${esc(e.roast)}</span><button class="btn btn--ghost" data-wdel="${esc(e.id)}" style="padding:.4rem .8rem;font-size:.65rem;min-height:0">Delete</button></div>`).join('')||'<p class="empty">No entries.</p>';
    }catch{}
  }
  function resizeJpeg(file){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height;const m=1200/Math.max(w,h);if(m<1){w=Math.round(w*m);h=Math.round(h*m);}
    let q=.8;const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
    const go=()=>{const u=c.toDataURL('image/jpeg',q).split(',')[1];if(u.length*3/4>290*1024&&q>.3){q-=.1;return go();}u.length*3/4>300*1024?rej(new Error('Image still over 300KB')):res(u);};go();};im.onerror=()=>rej(new Error('Bad image'));im.src=URL.createObjectURL(file);});}
  $('#wallForm').addEventListener('submit',async(ev)=>{ev.preventDefault();
    if(!$('#wConsent').checked)return toast('Consent required');
    try{const image=await resizeJpeg($('#wImg').files[0]);
      const r=await fetch('/api/wall',{method:'POST',headers:{authorization:'Bearer '+key,'content-type':'application/json'},body:JSON.stringify({name:$('#wName').value,breed:$('#wBreed').value,line1:$('#wL1').value,line2:$('#wL2').value,roast:$('#wRoast').value,city:$('#wCity').value,consent:true,image})});
      const d=await r.json();if(!r.ok)throw new Error(d.error||'Failed');toast('Added');ev.target.reset();wallLoad();
    }catch(e){toast(e.message);}});
  $('#wallList').addEventListener('click',async(ev)=>{const id=ev.target.dataset&&ev.target.dataset.wdel;if(!id||!confirm('Delete this entry?'))return;
    const r=await fetch('/api/wall?id='+encodeURIComponent(id),{method:'DELETE',headers:{authorization:'Bearer '+key}});toast(r.ok?'Deleted':'Failed');wallLoad();});
  $('#keyForm').addEventListener('submit',()=>setTimeout(()=>{if(key)wallLoad();},400));
  if(key)wallLoad();
})();
</script>
</body>
</html>
