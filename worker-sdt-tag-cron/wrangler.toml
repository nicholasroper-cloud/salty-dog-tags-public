# Cron Worker for the smart QR tag: retry failed alerts every 15 min, purge expired data and run the /T/ canary daily.
# Deploy:  cd worker-sdt-tag-cron && npx wrangler deploy      (after the D1 database id below is filled in)
# Secrets (npx wrangler secret put NAME, from this folder): RESEND_API_KEY, TWILIO_SID, TWILIO_TOKEN, TAG_TWILIO_MSID,
#   PUSHOVER_TOKEN, PUSHOVER_USER, IP_SALT is NOT needed here. See README "Smart QR tag: setup".
name = "worker-sdt-tag-cron"
main = "src/index.js"
compatibility_date = "2026-08-09"

[triggers]
crons = ["*/15 * * * *", "17 9 * * *"]

[vars]
SITE_URL = "https://saltydogtags.com"
CANARY_ID = "CANARY0000"
# SMS_ALERTS_ENABLED defaults to true in code. Set "false" here too if you ever turn texting off.

[[d1_databases]]
binding = "TAGDB"
database_name = "sdt-tags"
database_id = "52f33a8d-82e5-41d4-9fa6-308a037405fb"
